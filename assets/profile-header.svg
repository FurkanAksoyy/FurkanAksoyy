<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Furkan Aksoy</title>
  <desc id="desc">Software engineer. AI, data, and the software between them.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d5e9dd" stroke-opacity=".055"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d1b"/><stop offset="1" stop-color="#182925"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <rect x="52" y="51" width="30" height="3" rx="1.5" fill="#82dbb0"/>
  <text x="96" y="58" fill="#9cb5ab" font-family="monospace" font-size="13" letter-spacing="2">SOFTWARE ENGINEER / ISTANBUL</text>
  <text x="50" y="155" fill="#f4f1e9" font-family="Georgia,serif" font-size="75">Furkan Aksoy</text>
  <text x="54" y="205" fill="#d0ddd4" font-family="Arial,sans-serif" font-size="25">AI, data, and the software between them.</text>
  <path d="M54 246H648" stroke="#456356" stroke-width="1"/>
  <text x="54" y="282" fill="#82dbb0" font-family="monospace" font-size="15">TEXT-TO-SQL</text>
  <text x="206" y="282" fill="#6b8e7c" font-family="monospace" font-size="15">/</text>
  <text x="233" y="282" fill="#c0d0c5" font-family="monospace" font-size="15">BACKEND</text>
  <text x="333" y="282" fill="#6b8e7c" font-family="monospace" font-size="15">/</text>
  <text x="360" y="282" fill="#c0d0c5" font-family="monospace" font-size="15">APPLIED AI</text>
  <rect x="760" y="52" width="466" height="256" rx="12" fill="#0e1916" stroke="#3b5649"/>
  <circle cx="786" cy="77" r="4" fill="#82dbb0"/>
  <circle cx="802" cy="77" r="4" fill="#647c6d"/>
  <circle cx="818" cy="77" r="4" fill="#3b5649"/>
  <text x="1198" y="82" fill="#839d8d" font-family="monospace" font-size="12" text-anchor="end">question → insight</text>
  <path d="M760 96H1226" stroke="#2d4338"/>
  <text x="790" y="140" fill="#82dbb0" font-family="monospace" font-size="15">01</text>
  <text x="830" y="140" fill="#e6ebe3" font-family="monospace" font-size="16">Find the right context.</text>
  <text x="790" y="184" fill="#82dbb0" font-family="monospace" font-size="15">02</text>
  <text x="830" y="184" fill="#e6ebe3" font-family="monospace" font-size="16">Generate the query.</text>
  <text x="790" y="228" fill="#82dbb0" font-family="monospace" font-size="15">03</text>
  <text x="830" y="228" fill="#e6ebe3" font-family="monospace" font-size="16">Check the result.</text>
  <text x="790" y="272" fill="#82dbb0" font-family="monospace" font-size="15">04</text>
  <text x="830" y="272" fill="#e6ebe3" font-family="monospace" font-size="16">Make it useful.</text>
</svg>
