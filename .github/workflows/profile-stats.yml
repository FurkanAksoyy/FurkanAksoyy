name: Refresh profile statistics

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-statistics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&hide_rank=true&card_width=467&bg_color=101d1b&title_color=82dbb0&text_color=d0ddd4&icon_color=82dbb0&border_radius=14&disable_animations=true
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=101d1b&title_color=82dbb0&text_color=d0ddd4&card_width=467&exclude_repo=FurkanAksoyy,open-slide&border_radius=14&disable_animations=true
          path: assets/github-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Commit refreshed cards
        run: |
          git add assets/github-stats.svg assets/github-languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile statistics'
          git push
